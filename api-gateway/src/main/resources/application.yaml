spring:
  application:
    name: api-gateway
  config:
    import: optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:${CONFIG_SERVER_PORT:8888}

# OpenAPI Aggregation - Centralized Swagger UI
springdoc:
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    config-url: /v3/api-docs/swagger-config
    urls:
      - name: Auth Service
        url: /auth-service/v3/api-docs
      - name: Patient Service
        url: /patient-service/v3/api-docs
      - name: Medicine Service
        url: /medicine-service/v3/api-docs
      - name: HR Service
        url: /hr-service/v3/api-docs
      - name: Appointment Service
        url: /appointment-service/v3/api-docs
      - name: Medical Exam Service
        url: /medical-exam-service/v3/api-docs
      - name: Billing Service
        url: /billing-service/v3/api-docs
      - name: Report Service
        url: /report-service/v3/api-docs
      - name: Notification Service
        url: /notification-service/v3/api-docs
