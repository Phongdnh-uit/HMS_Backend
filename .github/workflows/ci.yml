name: CI Build and Push Docker Images

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Checkout source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Validate Gradle wrapper (security best practice)
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v3

      # 3️⃣ Setup JDK
      - name: Set up JDK 23
        uses: actions/setup-java@v4
        with:
          java-version: "23"
          distribution: temurin
          cache: gradle

      # 4️⃣ Build all modules
      - name: Build all modules
        run: ./gradlew clean build -x test --no-daemon

      # 5️⃣ Test all modules
      - name: Test all modules
        run: ./gradlew test --no-daemon

  build-and-push:
    # Only run on push events (not PRs) to avoid pushing untested images
    if: github.event_name == 'push'
    needs: test # Wait for tests to pass before building images
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - config-server
          - discovery-service
          - api-gateway
          - auth-service
          - medicine-service
          - patient-service
          - hr-service
          - appointment-service
          - medical-exam-service
          - billing-service
          - report-service
          - notification-service

    steps:
      # 1️⃣ Checkout source
      - name: Checkout code
        uses: actions/checkout@v4

      # 2️⃣ Login Docker Hub
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # 3️⃣ Setup Buildx
      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      # 4️⃣ Build & Push Image (each service builds only itself)
      - name: Build & Push ${{ matrix.service }} Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infrastructure/pro/Dockerfile
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.service }}:${{ github.sha }}
          build-args: |
            SERVICE=${{ matrix.service }}
            JAVA_VERSION=23
          cache-from: type=gha
          cache-to: type=gha,mode=max
