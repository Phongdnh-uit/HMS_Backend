# Test configuration for HMS Patient Service
# This configuration disables cloud dependencies and uses H2 in-memory database

spring:
  # Disable cloud config
  cloud:
    config:
      enabled: false

  # H2 in-memory database
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA settings for testing
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  # H2 Console for debugging (optional)
  h2:
    console:
      enabled: true
      path: /h2-console

# Disable Eureka client
eureka:
  client:
    enabled: false

# Disable Docker Compose auto-start
docker:
  compose:
    enabled: false

# Logging configuration for tests
logging:
  level:
    root: WARN
    com.hms: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

# Test-specific properties
hms:
  test:
    enabled: true
