# Test configuration for billing-service
# Supports Circuit Breaker tests and H2 in-memory database

spring:
  application:
    name: billing-service-test
  main:
    allow-bean-definition-overriding: true
  
  # Disable cloud config
  cloud:
    config:
      enabled: false
    discovery:
      enabled: false

  # H2 in-memory database
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  # JPA settings for testing
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false

  # H2 Console for debugging (optional)
  h2:
    console:
      enabled: true
      path: /h2-console

# Disable Eureka client
eureka:
  client:
    enabled: false

# Disable Docker Compose auto-start
docker:
  compose:
    enabled: false

# Circuit Breaker test configuration - faster timeouts for testing
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 5
        minimumNumberOfCalls: 5
        failureRateThreshold: 50
        waitDurationInOpenState: 1s
        permittedNumberOfCallsInHalfOpenState: 2
        automaticTransitionFromOpenToHalfOpenEnabled: false
        slowCallDurationThreshold: 500ms
        slowCallRateThreshold: 80
    instances:
      billingMedicalExam:
        baseConfig: default
      billingHr:
        baseConfig: default
      billingAppointment:
        baseConfig: default
      billingPatient:
        baseConfig: default

# Logging configuration for tests
logging:
  level:
    root: WARN
    com.hms: DEBUG
    io.github.resilience4j: DEBUG
    com.hms.billing_service: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG

# Test-specific properties
hms:
  test:
    enabled: true
